<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<!--begin::Head-->
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <!--begin::Fonts-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700"/>
    <!--end::Fonts-->
    <!--begin::Page Vendors Styles-->
    <link th:href="@{/assets/plugins/custom/datatables/datatables.bundle.css}" rel="stylesheet" type="text/css"/>
    <!--end::Page Vendors Styles-->
    <!--begin::Global Theme Styles-->
    <link th:href="@{/assets/plugins/global/plugins.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/plugins/custom/prismjs/prismjs.bundle.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/css/style.bundle.min.css}" rel="stylesheet" type="text/css"/>
    <!--end::Global Theme Styles-->
    <!--begin::Layout Themes-->
    <link th:href="@{/assets/css/themes/layout/header/base/light.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/css/themes/layout/header/menu/light.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/css/themes/layout/brand/dark.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/css/themes/layout/aside/dark.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/assets/css/custom.css}" rel="stylesheet" type="text/css"/>
    <!--end::Layout Themes-->
    <link rel="icon" type="image/png" th:href="@{/assets/img/logo.png}"/>
    <th:block layout:fragment="title">
        <title>Learning</title>
    </th:block>

    <style>
        .error {
            color: #F64E60 !important;
            font-size: 0.9rem !important;
            width: 100%;
            margin-top: 0.25rem;
        }

        .table thead td, .table thead th, table {
            font-size: 0.89rem !important;
        }

        td {
            vertical-align: middle !important;
        }

        .aside {
            position: fixed !important;
        }
    </style>
    <th:block layout:fragment="styles"></th:block>
</head>
<!--end::Head-->
<!--begin::Body-->
<body id="kt_body"
      class="header-fixed header-mobile-fixed subheader-enabled subheader-fixed aside-enabled aside-fixed aside-minimize-hoverable page-loading">
<!--begin::Header Mobile-->
<div id="kt_header_mobile" class="header-mobile align-items-center header-mobile-fixed">
    <!--begin::Logo-->
    <a href="/">
        <h3 class="text-white m-0">Learning</h3>
    </a>
    <!--end::Logo-->
    <!--begin::Toolbar-->
    <div class="d-flex align-items-center">
        <button class="btn p-0 burger-icon burger-icon-left" id="kt_aside_mobile_toggle">
            <span></span>
        </button>
        <button class="btn p-0 burger-icon ml-4" id="kt_header_mobile_toggle">
            <span></span>
        </button>
    </div>
    <!--end::Toolbar-->
</div>
<!--end::Header Mobile-->
<div class="d-flex flex-column flex-root">
    <!--begin::Page-->
    <div class="d-flex flex-row flex-column-fluid page">
        <!--begin::Aside-->
        <div class="aside aside-left aside-fixed d-flex flex-column flex-row-auto" id="kt_aside">
            <!--begin::Brand-->
            <div class="brand flex-column-auto" id="kt_brand">
                <a href="/" class="brand-logo">
                    <h2 class="text-center text-primary m-0">Learning</h2>
                </a>
                <button class="brand-toggle btn btn-sm px-0" id="kt_aside_toggle">
                    <span class="svg-icon svg-icon svg-icon-xl">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 0 24 24" version="1.1">
                            <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                                <polygon points="0 0 24 0 24 24 0 24"/>
                                <path d="M5.29288961,6.70710318 C4.90236532,6.31657888 4.90236532,5.68341391 5.29288961,5.29288961 C5.68341391,4.90236532 6.31657888,4.90236532 6.70710318,5.29288961 L12.7071032,11.2928896 C13.0856821,11.6714686 13.0989277,12.281055 12.7371505,12.675721 L7.23715054,18.675721 C6.86395813,19.08284 6.23139076,19.1103429 5.82427177,18.7371505 C5.41715278,18.3639581 5.38964985,17.7313908 5.76284226,17.3242718 L10.6158586,12.0300721 L5.29288961,6.70710318 Z"
                                      fill="#000000" fill-rule="nonzero"
                                      transform="translate(8.999997, 11.999999) scale(-1, 1) translate(-8.999997, -11.999999)"/>
                                <path d="M10.7071009,15.7071068 C10.3165766,16.0976311 9.68341162,16.0976311 9.29288733,15.7071068 C8.90236304,15.3165825 8.90236304,14.6834175 9.29288733,14.2928932 L15.2928873,8.29289322 C15.6714663,7.91431428 16.2810527,7.90106866 16.6757187,8.26284586 L22.6757187,13.7628459 C23.0828377,14.1360383 23.1103407,14.7686056 22.7371482,15.1757246 C22.3639558,15.5828436 21.7313885,15.6103465 21.3242695,15.2371541 L16.0300699,10.3841378 L10.7071009,15.7071068 Z"
                                      fill="#000000" fill-rule="nonzero" opacity="0.3"
                                      transform="translate(15.999997, 11.999999) scale(-1, 1) rotate(-270.000000) translate(-15.999997, -11.999999)"/>
                            </g>
                        </svg>
                    </span>
                </button>
            </div>
            <!--end::Brand-->
            <!--begin::Aside Menu-->
            <div class="aside-menu-wrapper flex-column-fluid" id="kt_aside_menu_wrapper">
                <div id="kt_aside_menu" class="aside-menu my-4" data-menu-vertical="1" data-menu-scroll="1"
                     data-menu-dropdown-timeout="500">
                    <div th:replace="~{partials/side_menu :: menus}"></div>
                </div>
            </div>
            <!--end::Aside Menu-->
        </div>
        <!--end::Aside-->
        <!--begin::Wrapper-->
        <div class="d-flex flex-column flex-row-fluid wrapper" id="kt_wrapper">
            <!--begin::Header-->
            <div id="kt_header" class="header header-fixed" style="z-index: 9 !important;">
                <div class="container-fluid d-flex align-items-stretch justify-content-between">
                    <!--begin::Header Menu Wrapper-->
                    <div class="header-menu-wrapper header-menu-wrapper-left" id="kt_header_menu_wrapper">
                        <div id="kt_header_menu" class="header-menu header-menu-mobile header-menu-layout-default">
                            <ul class="menu-nav">
                                <li class="menu-item menu-item-rel menu-item-active" aria-haspopup="true">
                                    <a href="/" class="menu-link">
                                        <span class="menu-text text-primary" style="font-size: 18px;font-weight: bold">Learning</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <!--end::Header Menu Wrapper-->
                    <!--begin::Topbar-->
                    <div class="topbar">
                        <div class="topbar-item">
                            <div class="btn btn-icon w-auto btn-clean d-flex align-items-center btn-lg px-2">
                                <span class="text-dark-50 font-weight-bolder font-size-base d-none d-md-inline mr-3">Admin</span>
                                <span class="symbol symbol-35 symbol-light-primary">
                                    <span class="symbol-label font-size-h5 font-weight-bold">A</span>
                                </span>
                            </div>
                        </div>
                    </div>
                    <!--end::Topbar-->
                </div>
            </div>
            <!--end::Header-->
            <!--begin::Content-->
            <div class="content d-flex flex-column flex-column-fluid" id="kt_content">
                <!--begin::Subheader-->
                <div layout:fragment="page-header"></div>
                <!--end::Subheader-->
                <!--begin::Entry-->
                <div class="d-flex flex-column-fluid">
                    <div class="container-fluid">
                        <div th:replace="~{partials/_alerts :: alerts}"></div>
                        <div layout:fragment="content"></div>
                    </div>
                </div>
                <!--end::Entry-->
            </div>
            <!--end::Content-->
            <!--begin::Footer-->
            <div class="footer bg-white py-4 d-flex flex-lg-column" id="kt_footer">
                <div class="container-fluid d-flex flex-column flex-md-row align-items-center justify-content-between">
                    <div class="text-dark order-2 order-md-1">
                        <a href="/" class="text-dark-75 font-weight-bold text-hover-primary">
                            Learning &copy;<span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span>
                        </a>
                    </div>
                </div>
            </div>
            <!--end::Footer-->
        </div>
        <!--end::Wrapper-->
    </div>
    <!--end::Page-->
</div>

<!--begin::Scrolltop-->
<div id="kt_scrolltop" class="scrolltop">
    <span class="svg-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" viewBox="0 0 24 24" version="1.1">
            <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                <polygon points="0 0 24 0 24 24 0 24"/>
                <rect fill="#000000" opacity="0.3" x="11" y="10" width="2" height="10" rx="1"/>
                <path d="M6.70710678,12.7071068 C6.31658249,13.0976311 5.68341751,13.0976311 5.29289322,12.7071068 C4.90236893,12.3165825 4.90236893,11.6834175 5.29289322,11.2928932 L11.2928932,5.29289322 C11.6714722,4.91431428 12.2810586,4.90106866 12.6757246,5.26284586 L18.6757246,10.7628459 C19.0828436,11.1360383 19.1103465,11.7686056 18.7371541,12.1757246 C18.3639617,12.5828436 17.7313944,12.6103465 17.3242754,12.2371541 L12.0300757,7.38413782 L6.70710678,12.7071068 Z"
                      fill="#000000" fill-rule="nonzero"/>
            </g>
        </svg>
    </span>
</div>
<!--end::Scrolltop-->

<!--begin::Global Theme Bundle-->
<script>
    var KTAppSettings = {
        "breakpoints": {"sm": 576, "md": 768, "lg": 992, "xl": 1200, "xxl": 1200},
        "colors": {
            "theme": {
                "base": {
                    "white": "#ffffff", "primary": "#3699FF", "secondary": "#E5EAEE", "success": "#1BC5BD",
                    "info": "#8950FC", "warning": "#FFA800", "danger": "#F64E60", "light": "#F3F6F9", "dark": "#212121"
                },
                "light": {
                    "white": "#ffffff", "primary": "#E1F0FF", "secondary": "#ECF0F3", "success": "#C9F7F5",
                    "info": "#EEE5FF", "warning": "#FFF4DE", "danger": "#FFE2E5", "light": "#F3F6F9", "dark": "#D6D6E0"
                },
                "inverse": {
                    "white": "#ffffff", "primary": "#ffffff", "secondary": "#212121", "success": "#ffffff",
                    "info": "#ffffff", "warning": "#ffffff", "danger": "#ffffff", "light": "#464E5F", "dark": "#ffffff"
                }
            },
            "gray": {
                "gray-100": "#F3F6F9", "gray-200": "#ECF0F3", "gray-300": "#E5EAEE", "gray-400": "#D6D6E0",
                "gray-500": "#B5B5C3", "gray-600": "#80808F", "gray-700": "#464E5F", "gray-800": "#1B283F", "gray-900": "#212121"
            }
        },
        "font-family": "Poppins"
    };
</script>
<script th:src="@{/assets/plugins/global/plugins.bundle.js}"></script>
<script th:src="@{/assets/plugins/custom/prismjs/prismjs.bundle.js}"></script>
<script th:src="@{/assets/js/scripts.bundle.min.js}"></script>
<script th:src="@{/assets/plugins/custom/datatables/datatables.bundle.js}"></script>
<script th:src="@{/assets/js/spring.jquery.friendly.js}"></script>
<script src="https://cdn.jsdelivr.net/jquery.validation/1.16.0/jquery.validate.min.js"></script>
<script>
    $(document).on('change', '.custom-file-input', function () {
        const input = $(this);
        const fileName = input.val();
        if (fileName === '') {
            input.next('.custom-file-label').html('Choose file');
        } else {
            input.next('.custom-file-label').html(fileName.replace('C:\\fakepath\\', ' '));
        }
    });

    $(function () {
        $('.main_datatable').DataTable({responsive: false});
        $('select.select2').select2({placeholder: "CHOOSE"});
    });

    $(document).tooltip({selector: '[data-toggle="tooltip"]'});

    $('.end-today-datepicker').datepicker({
        format: 'yyyy-mm-dd', endDate: 'today', todayHighlight: true, todayBtn: "linked", clearBtn: true
    });
    $('.start-today-datepicker').datepicker({
        format: 'yyyy-mm-dd', startDate: 'today', todayHighlight: true, todayBtn: "linked", clearBtn: true
    });
    $('.normal-datepicker').datepicker({
        format: 'yyyy-mm-dd', todayHighlight: true, todayBtn: "linked", clearBtn: true
    });

    // Let select2 / datepickers inside modals receive focus
    $.fn.modal.Constructor.prototype.enforceFocus = function () {
    };
</script>
<th:block layout:fragment="script"></th:block>
<!--end::Page Scripts-->
</body>
<!--end::Body-->
</html>
