server.port=8080

# Database (matches docker-compose.yml and flyway.conf)
spring.datasource.url=jdbc:postgresql://localhost:5435/learning
spring.datasource.username=postgres
spring.datasource.password=postgres

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate never alters it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Dev conveniences
spring.thymeleaf.cache=false
management.endpoints.web.exposure.include=health,info

# Keep session ids in cookies only (no ;jsessionid=... in redirect URLs)
server.servlet.session.tracking-modes=cookie
